server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-auth-service
spring.cloud.gateway.routes[0].uri=lb://user-auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.routes[1].id=catalog-product-service
spring.cloud.gateway.routes[1].uri=lb://catalog-product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/catalog/**

spring.cloud.gateway.routes[2].id=order-cart-service
spring.cloud.gateway.routes[2].uri=lb://order-cart-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[3].id=admin-reporting-service
spring.cloud.gateway.routes[3].uri=lb://admin-reporting-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

app.jwt.secret=shopSphereSuperSecretKeyForJwtSigningChangeMeInProduction123!

logging.level.org.springframework.cloud.gateway=INFO